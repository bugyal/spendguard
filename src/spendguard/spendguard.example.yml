# spendguard.yml — spend containment for running agents.
# Every key is optional. Unknown keys are rejected, so a typo cannot
# silently disable a cap. Reference: README.md.

# Ledger (ledger.sqlite3) and event log (events.jsonl). Relative paths are
# resolved against this file's directory.
state_dir: .spendguard

# Budget periods (hour/day/week/month) roll over in this zone: utc | local
timezone: utc

proxy:
  listen: 127.0.0.1:8787
  # true: only spendguard credentials (sg_...) are accepted.
  # false: agents may also send their own provider key + X-Spendguard-* tags.
  require_credential: false
  # Ask OpenAI-style streams to report usage (stream_options.include_usage).
  inject_stream_usage: true
  upstream_timeout: 600

# Requests to /<name>/... go to base_url. openai and anthropic are built in.
# api_key_env names the variable in the `spendguard serve` environment that
# holds the real key swapped in for a spendguard credential.
upstreams:
  openai:
    base_url: https://api.openai.com
    api_key_env: OPENAI_API_KEY
  anthropic:
    base_url: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY
  # openrouter:
  #   base_url: https://openrouter.ai/api
  #   format: openai
  #   api_key_env: OPENROUTER_API_KEY

breaker:
  enabled: true
  max_repeats: 10             # same tool, same error class: the 11th in a row pauses the agent
  api_error_repeats: 20       # same upstream error (e.g. http_500): the 21st in a row pauses
  max_identical_requests: 10  # byte-identical request: the 11th send pauses
  window_seconds: 3600        # failures older than this are forgotten
  cooldown_seconds: 0         # 0 = stay paused until `spendguard resume`

budgets:
  # Each customer separately: alert at $5/day, refuse at $15/day.
  - scope: customer
    match: "*"
    period: day
    soft_usd: 5
    hard_usd: 15
  # One customer's monthly plan: pause (a human decides) at $400.
  - scope: customer
    match: acme
    period: month
    soft_usd: 300
    hard_usd: 400
    action: pause
  # Each agent: alert at $20/day.
  - scope: agent
    match: "*"
    period: day
    soft_usd: 20
  # Everything together: the last-resort kill switch.
  - scope: global
    period: day
    hard_usd: 200
    action: pause

# USD per 1M tokens; adds to / overrides the built-in table. "default" is
# charged for unknown models — high on purpose: over-count, never under-count.
pricing:
  # my-finetune:
  #   input: 3.0
  #   output: 12.0
  default:
    input: 15.0
    output: 75.0

# Event JSON arrives on stdin; SPENDGUARD_EVENT and SPENDGUARD_TEXT are set.
hooks:
  # - events: [breaker_tripped, hard_cap_exceeded, paused]
  #   command: ["/usr/local/bin/page-oncall"]
  # - events: [soft_cap_exceeded]
  #   url: http://127.0.0.1:9000/spendguard
